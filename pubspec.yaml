name: contruttore
description: "App de gestão de construção residencial"
publish_to: 'none'

version: 1.1.0

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Estado
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  dartz: ^0.10.1

  # Injeção de dependência
  get_it: ^8.0.2
  injectable: ^2.4.4

  # Navegação
  go_router: ^14.6.2

  # Cache local
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  fl_chart: ^0.68.0
  shimmer: ^3.0.0

  # Utilidades
  uuid: ^4.5.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  # file_picker: ^8.3.7  # Temporariamente desabilitado - incompatível com SDK 36
  share_plus: ^10.1.1
  pdf: ^3.11.1
  printing: ^5.13.3

  # APIs externas
  http: ^1.2.2
  dio: ^5.7.0
  html: ^0.15.4

  # Icons
  cupertino_icons: ^1.0.8
  firebase_app_check: ^0.3.2+10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  
  # Testes
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

# Made with Bob
