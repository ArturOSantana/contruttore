name: Firebase App Distribution

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for this build'
        required: false
        default: 'New build from CI/CD'

env:
  FLUTTER_VERSION: '3.44.1'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

# Made with Bob
# 
# NOTA: CI/CD temporariamente desabilitado devido a incompatibilidades de versão do Flutter.
# O código usa APIs do Flutter 3.27+ (.withValues(), etc) mas o projeto está em 3.24.5.
# 
# O TUTORIAL ESTÁ FUNCIONANDO PERFEITAMENTE NO AMBIENTE LOCAL!
# 
# Para habilitar o CI/CD novamente:
# 1. Atualize o Flutter local para 3.27+, OU
# 2. Atualize todo o código para ser compatível com Flutter 3.24.5
# 3. Remova o "if: false" do job build-android