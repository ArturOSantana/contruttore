name: Firebase App Distribution

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for this build'
        required: false
        default: 'New build from CI/CD'

env:
  FLUTTER_VERSION: '3.44.1'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload to Firebase App Distribution
        run: |
          # Usar secret se disponível, senão usar valor padrão
          APP_ID="${{ secrets.FIREBASE_APP_ID }}"
          if [ -z "$APP_ID" ]; then
            APP_ID="1:721464031041:android:edd98fc3ce3f81a2b053c0"
            echo "⚠️ Usando App ID padrão (secret não configurado)"
          else
            echo "✅ Usando App ID do secret"
          fi
          
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "$APP_ID" \
            --groups "tester-production" \
            --release-notes "Build ${{ github.run_number }} - Tutorial implementado"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}